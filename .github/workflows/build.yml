name: Native FFmpeg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: FFmpeg branch
        default: master
      ffmpeg_revision:
        description: Optional exact FFmpeg commit

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve FFmpeg revision without cloning
        id: resolve
        env:
          FFMPEG_BRANCH: ${{ inputs.ffmpeg_branch || 'master' }}
          FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
        run: python3 tools/ci.py resolve
      - name: Fetch source once for the entire matrix
        env:
          FFMPEG_BRANCH: ${{ inputs.ffmpeg_branch || 'master' }}
          FFMPEG_REVISION: ${{ steps.resolve.outputs.revision }}
        run: python3 tools/ci.py source
      - name: Python regression tests
        run: |
          python3 -m compileall -q build.py tools tests
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: ffmpeg-source.tar.gz
          compression-level: 0
          retention-days: 1

  platform:
    needs: source
    name: ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: windows-x64, runner: windows-2022, preset: windows-msvc}
          - {name: linux-x64, runner: ubuntu-24.04, preset: linux}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, preset: linux}
          - {name: macos-x64, runner: macos-15-intel, preset: macos}
          - {name: macos-arm64, runner: macos-15, preset: macos}
    uses: ./.github/workflows/platform.yml
    with:
      target: ${{ matrix.target.name }}
      runner: ${{ matrix.target.runner }}
      preset: ${{ matrix.target.preset }}
      revision: ${{ needs.source.outputs.revision }}
