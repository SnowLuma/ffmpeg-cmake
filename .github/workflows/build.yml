name: Native FFmpeg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: FFmpeg branch
        default: master
      ffmpeg_revision:
        description: Optional exact FFmpeg commit

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve FFmpeg revision
        id: source
        env:
          FFMPEG_BRANCH: ${{ inputs.ffmpeg_branch || 'master' }}
          FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
        run: |
          python3 tools/sources.py --branch "$FFMPEG_BRANCH" ${FFMPEG_REVISION:+--revision "$FFMPEG_REVISION"}
          echo "revision=$(git -C ffmpeg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.target.name }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shared: ['OFF', 'ON']
        target:
          - {name: windows-x64, runner: windows-2022, preset: windows-msvc}
          - {name: linux-x64, runner: ubuntu-24.04, preset: linux}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, preset: linux}
          - {name: macos-x64, runner: macos-15-intel, preset: macos}
          - {name: macos-arm64, runner: macos-15, preset: macos}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: 2G
      PRESET: ${{ matrix.target.preset }}
      FFMPEG_BRANCH: ${{ inputs.ffmpeg_branch || 'master' }}
      FFMPEG_REVISION: ${{ needs.source.outputs.revision }}
      SHARED: ${{ matrix.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm zlib1g-dev libbz2-dev liblzma-dev libasound2-dev libsdl2-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nasm sdl2
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: .tools/downloads
          key: native-tools-${{ runner.os }}-${{ hashFiles('tools/bootstrap.py') }}
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: python tools/bootstrap.py
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Fetch selected FFmpeg source
        shell: python
        run: |
          import os, subprocess
          subprocess.run(['python', 'tools/sources.py', '--branch', os.environ['FFMPEG_BRANCH'], '--revision', os.environ['FFMPEG_REVISION']], check=True)
      - name: Build and test
        shell: python
        run: |
          import os, subprocess
          subprocess.run(['python', 'build.py', '--preset', os.environ['PRESET'], '--action', 'test', '--jobs', '4', '--', '-DBUILD_SHARED_LIBS=' + os.environ['SHARED'], '-DFFMPEG_ASM=ON'], check=True)
      - name: Install and test package
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          preset = os.environ['PRESET']
          subprocess.run(['cmake', '--install', 'build/' + preset], check=True)
          subprocess.run(['python', 'tests/package.py', '--prefix', str(Path('install', preset).resolve())], check=True)
      - name: Verify header dependencies
        shell: python
        run: |
          import os, subprocess
          subprocess.run(['python', 'tests/incremental.py', '--build', 'build/' + os.environ['PRESET']], check=True)
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
      - name: Archive installation
        shell: python
        run: |
          import os, shutil
          shutil.make_archive('ffmpeg-${{ matrix.target.name }}-shared-${{ matrix.shared }}', 'gztar', 'install/' + os.environ['PRESET'])
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target.name }}-shared-${{ matrix.shared }}
          path: ffmpeg-*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.target.name }}-shared-${{ matrix.shared }}
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/Testing/Temporary/LastTest.log
            build/*/generated/components.json
